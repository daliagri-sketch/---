  --display:'Karantina',sans-serif;
  --sans:'Heebo',sans-serif;

  --deviceW:390px;
  --deviceH:844px;

  /* review chrome only — never inside the phone */
  --rv-bg:#E4E1DA;
  --rv-ink:#141414;
}
body.device-320{--deviceW:320px;--deviceH:640px}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--rv-bg);color:var(--ink);font-family:var(--sans);font-weight:300;overflow-x:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ===================== REVIEW CHROME ===================== */
.rv-toolbar{
  background:#141414;color:#FAF8F3;padding:10px 14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  font-family:var(--sans);font-weight:400;font-size:13px;
}
.rv-title{margin-inline-end:auto;display:flex;align-items:center;gap:10px;white-space:nowrap}
.rv-title img{height:16px;display:block}
.rv-title span{letter-spacing:.2px;opacity:.85}
.rv-group{display:flex;gap:4px;flex-wrap:wrap}
.rv-btn,.rv-select{
  min-height:34px;padding:6px 10px;border:1px solid rgba(250,248,243,.3);
  background:transparent;color:#FAF8F3;border-radius:0;font-size:13px;
}
.rv-btn[aria-pressed="true"]{background:#FAF8F3;color:#141414;border-color:#FAF8F3}
.rv-select{background:#141414;max-width:260px}

.workspace{display:flex;justify-content:center;padding:28px 16px 64px}
.single{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}

.rv-nav{width:min(560px,calc(100vw - 32px));display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:400}
.rv-nav button{min-height:38px;padding:6px 14px;border:1px solid var(--rv-ink);background:#fff;border-radius:0}
.rv-nav button:disabled{opacity:.3;cursor:not-allowed}
.rv-counter{color:#46423B;text-align:center}

.rv-panel{
  display:none;width:min(560px,calc(100vw - 32px));
  background:#fff;border:1px solid rgba(20,20,20,.18);
  padding:12px 14px;font-size:13px;line-height:1.55;font-weight:400;
}
.review-mode .rv-panel{display:block}
.rv-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;direction:ltr;justify-content:flex-end}
.chip{border:1px solid var(--rv-ink);padding:2px 7px;font-size:11px;font-weight:500;letter-spacing:.2px}
.chip.blocker{background:var(--rv-ink);color:#fff}
.chip.dependency{border-style:dashed}
.chip.flag{border-color:#A13222;color:#A13222}
.rv-note{direction:ltr;text-align:left}
.rv-flag{direction:ltr;text-align:left;margin-top:8px;padding-top:8px;border-top:1px solid rgba(20,20,20,.12);color:#A13222}
.rv-flag b{font-weight:500}

/* Missing governed state — Review View only */
.rv-boundary{
  display:none;width:min(var(--deviceW),calc(100vw - 32px));
  border:1px dashed #8A857A;padding:18px 16px;
  font-size:12px;line-height:1.5;color:#4A463E;direction:ltr;text-align:left;font-weight:400;
}
.rv-boundary b{display:block;font-weight:500;color:#141414;margin-bottom:4px;letter-spacing:.3px}
.review-mode .at-boundary .rv-boundary{display:block}

/* storyboard / capture */
.board{display:none;width:100%;max-width:1400px;flex-direction:column;gap:36px}
.storyboard-mode .single{display:none}
.storyboard-mode .board{display:flex}
.board-group h2{font:500 14px/1.3 var(--sans);margin:0 0 12px;direction:ltr;text-align:left;color:#46423B}
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,var(--deviceW));gap:28px 24px;justify-content:start;align-items:start}
.board-card{display:flex;flex-direction:column;gap:8px;min-width:0}
.board-title{font:400 12px/1.3 var(--sans);color:#4B4740;direction:ltr;text-align:left}
.board-card .phone{max-height:none;min-height:0;overflow:visible}
.board-card .rv-panel{width:auto}
.board-card .rv-boundary{width:auto}
.review-mode .board-card.at-boundary .rv-boundary{display:block}

.capture .rv-toolbar,.capture .rv-nav{display:none!important}
.capture .workspace{padding:28px 28px 40px;justify-content:flex-start}
.capture .board{max-width:none}
.capture-head{display:none;font:400 13px/1.5 var(--sans);direction:ltr;text-align:left;color:#46423B;margin-bottom:4px}
.capture-head b{font-weight:500;color:#141414}
.capture .capture-head{display:block}

/* ===================== PRODUCT (inside phone) ===================== */
.phone{
  width:min(var(--deviceW),calc(100vw - 32px));
  min-height:var(--deviceH);max-height:var(--deviceH);
  overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  background:var(--page);
  container-type:inline-size;
}
.screen{min-height:var(--deviceH);display:flex;flex-direction:column;background:var(--page)}
.board-card .screen{min-height:var(--deviceH)}

/* header · §2.5 */
.app-header{height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
.wordmark{display:block;height:22px;width:auto}
.status-label{font:400 16px/1 var(--sans);color:var(--ink)}

/* context strip · §2.5 */
.context-strip{background:var(--beige);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;font:400 15px/1.4 var(--sans)}
.dots{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.dots i{display:block;width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.18}
.dots i.done{opacity:1}
.dots i.cur{opacity:1;width:11px;height:11px;background:var(--yellow);box-shadow:inset 0 0 0 1.5px var(--ink)}

/* content */
.content{flex:1 0 auto;display:flex;flex-direction:column;gap:22px;padding:36px 24px 0}
.s-picture .content{gap:28px}
.s-prep .content{gap:24px}
.s-runtime .content{gap:20px;padding-top:24px}
.s-entry .content{gap:18px;justify-content:flex-end}

.title{display:flex;flex-direction:column;gap:6px}
.eyebrow{font:300 15px/1.4 var(--sans);color:var(--muted)}
h1,h2,p{margin:0}
h1{font:400 clamp(44px,13.3cqw,52px)/.98 var(--display);color:var(--ink);overflow-wrap:normal;word-break:keep-all}
.s-entry h1{font-size:clamp(60px,19.5cqw,76px);line-height:.92}
.s-picture h1{font-size:clamp(42px,12.3cqw,48px)}
.s-runtime h1{font-size:36px;line-height:1}
.ink-bar{width:48px;height:6px;background:var(--ink)}
.subline{font:300 17px/1.65 var(--sans);color:var(--text-2)}
.s-entry .subline{font-size:19px;line-height:1.6}

.body{font:300 17px/1.7 var(--sans)}
.paras{display:flex;flex-direction:column;gap:10px}

.label{font:500 15px/1.4 var(--sans)}
.statement{font:400 clamp(30px,9.75cqw,38px)/1.02 var(--display)}

.section{border-top:1px solid var(--divider);padding-top:20px;display:flex;flex-direction:column;gap:10px}
.section h2{font:500 15px/1.4 var(--sans)}

.hero{background:var(--beige);padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.s-preday .hero .statement{font-size:clamp(30px,9.2cqw,36px)}

.accent{background:var(--card);border-right:4px solid var(--ink);padding:20px 18px;display:flex;flex-direction:column;gap:10px}
.accent .statement{font-size:clamp(28px,8.2cqw,32px);line-height:1.05}
.s-preday .accent .statement{font-size:clamp(29px,8.7cqw,34px)}

.support{background:var(--card);border-right:4px solid var(--ink);padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.support .value{font:300 17px/1.5 var(--sans)}

.block{background:var(--beige);padding:20px;display:flex;flex-direction:column;gap:6px}
.block .essence{font:500 18px/1.6 var(--sans)}
.block .label{display:flex;align-items:center;gap:8px}
.block .label svg{flex:0 0 20px}
.prep-block{background:var(--beige);padding:24px 20px;display:flex;flex-direction:column;gap:10px}
.prep-block .body{line-height:1.75}

.result{background:var(--beige);padding:22px 20px;display:flex;flex-direction:column;gap:10px}
.result .statement{font-size:clamp(28px,8.2cqw,32px);line-height:1.05}

/* Runtime "עכשיו" — the screen's only yellow · §3.3 */
.now{background:var(--yellow);padding:24px 22px;display:flex;flex-direction:column;gap:10px}
.now .label{display:flex;align-items:center;gap:8px}
.now .label:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--ink)}
.now .statement{font-size:clamp(30px,10.3cqw,40px);line-height:1.02}

/* timeline · §3.1 */
.timeline{position:relative;padding-right:30px;display:flex;flex-direction:column;gap:26px}
.timeline:before{content:"";position:absolute;right:6px;top:10px;bottom:30px;width:1px;background:rgba(20,20,20,.2)}
.tl-step{position:relative;display:flex;flex-direction:column;gap:4px}
.tl-step:before{content:"";position:absolute;right:-29px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--ink)}
.tl-step:last-child:before{width:15px;height:15px;right:-31px;top:4px}
.tl-label{font:300 15px/1.4 var(--sans);color:var(--muted)}
.tl-text{font:300 17px/1.65 var(--sans)}
.tl-step:last-child .tl-text{font:400 clamp(32px,9.75cqw,38px)/1 var(--display)}

/* checklist · §2.6 */
.checklist{display:flex;flex-direction:column;gap:12px}
.checkline{display:flex;align-items:flex-start;gap:12px;font:300 17px/1.6 var(--sans)}
.sq{flex:0 0 18px;width:18px;height:18px;border:1.5px solid var(--ink);margin-top:4px}

/* disclosure · §2.3 */
.disclosure{border-top:1px solid var(--divider)}
.disclosure summary{list-style:none;padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font:500 17px/1.4 var(--sans)}
.disclosure summary::-webkit-details-marker{display:none}
.disclosure summary .ic-minus{display:none}
.disclosure[open] summary .ic-plus{display:none}
.disclosure[open] summary .ic-minus{display:block}
.disclosure .items{display:flex;flex-direction:column;gap:12px;padding-bottom:22px;font:300 17px/1.6 var(--sans)}

/* fields */
.field-label{font:500 15px/1.4 var(--sans)}
.input,.textarea{width:100%;border:1px solid var(--btn-line);border-radius:0;background:var(--card);font:300 17px/1.5 var(--sans);padding:0 14px}
.input{height:54px}
.textarea{min-height:170px;padding:14px;resize:vertical;display:block}

/* option rows (list) · §3.4 Q2/Q3 */
.group{display:flex;flex-direction:column;gap:14px;border:0;margin:0;padding:0;min-width:0}
.group legend{padding:0;float:right;width:100%}
.group h2,.group legend{font:400 clamp(28px,8.2cqw,32px)/1 var(--display)}
.group legend + *{clear:both}
.rows{border-top:1px solid var(--divider-in)}
.row{width:100%;display:flex;align-items:flex-start;gap:14px;padding:16px 0;border:0;border-bottom:1px solid var(--divider-in);background:transparent;text-align:right;font:300 17px/1.5 var(--sans);border-radius:0}
.row[aria-disabled="true"]{color:var(--disabled);cursor:default}
.radio{position:relative;flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--radio-line);margin-top:1px}
.check{position:relative;flex:0 0 18px;width:18px;height:18px;border:1.5px solid var(--ink);margin-top:3px}
.selected .radio:after{content:"";position:absolute;inset:0;margin:auto;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.selected .check:after{content:"";position:absolute;inset:0;margin:auto;width:8px;height:8px;background:var(--ink)}
.unknown{color:var(--text-2)}
.unknown .radio,.unknown .check{border-style:dashed}

/* Q1 card buttons · §3.4 */
.q1{display:flex;flex-direction:column;gap:10px}
.q1 .row{min-height:58px;padding:14px 16px;border:1px solid var(--opt-line);background:var(--card);justify-content:center;align-items:center;gap:10px;text-align:center}
.q1 .radio{flex-basis:20px;width:20px;height:20px;margin-top:0}
.q1 .selected .radio:after{width:9px;height:9px}

/* actions · §2.1, §2.2, §2.4 */
.cta-zone{margin-top:auto;padding:28px 0 calc(36px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.primary{width:100%;min-height:58px;background:var(--yellow);color:var(--ink);border:0;border-radius:0;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;font:500 18px/1.35 var(--sans);text-align:right}
.primary svg{flex:0 0 20px;stroke:var(--ink)}
.primary[aria-disabled="true"]{background:var(--beige);color:var(--disabled);cursor:not-allowed}
.primary[aria-disabled="true"] svg{stroke:var(--disabled)}
.secondary{width:100%;min-height:56px;background:transparent;border:1px solid var(--btn-line);border-radius:0;font:400 17px/1.4 var(--sans);color:var(--ink);padding:10px 16px}
.secondary[aria-disabled="true"]{color:var(--disabled);cursor:default}

@media (max-width:520px){
  .rv-title{width:100%}
  .workspace{padding-inline:8px}
}
</style>
</head>

  return screen({eyebrow:"הבוקר", title:"צריך דיווח מהניסיון האחרון",
    body:`<div class="block"><div class="essence">${P.context}</div></div>`,
    cta:primary("לדווח מה קרה")});
}
function recovery(){
  return screen({eyebrow:"חזרה לאפליקציה", title:"אי אפשר להחזיר בבטחה את נקודת ההמשך של הבוקר הזה",
    body:`<p class="body">לא מתחילים מכאן תרגול חדש.</p>`,
    cta:primary("למסך הבית")});
}

/* ===== Journey map (routing unchanged from v0.1) ===== */
const branches = {
  primary:{label:"המסלול הראשי — KEEP → חזרות → FADE → יציאה חוקית",screens:[]},
  noPractice:{label:"ענף — No-practice",screens:[]},
  nonEvidence:{label:"ענף — Non-evidence practice",screens:[]},
  adjust:{label:"ענף — ADJUST ללא חלופה",screens:[]},
  reopen:{label:"ענף — ordinary reopen",screens:[]},
  recovery:{label:"ענף — PD-03R recovery",screens:[]},
  uncovered:{label:"ענף — יעד כשיר ללא template מכוסה",screens:[]}
};
const HOME_GAP = "HOME / LANDING EXPERIENCE NOT YET GOVERNED";
function s(id,title,html,meta={}){
  return {id,title,html,chips:meta.chips||[],note:meta.note||"",flag:meta.flag||"",blocker:!!meta.blocker,boundary:!!meta.boundary,boundaryText:meta.boundaryText||""};
}
const D2 = "Layout: no approved 06 board for this screen (D2). Global tokens + components only; no screen-specific layout invented.";
const BOARD = id => `Layout: 06 board ${id} · Code_Handoff_Morning_v1_0_FINAL.`;

branches.primary.screens.push(
  s("01","Entry",entryScreen(),{chips:["REVIEW COPY"],note:"Entry copy is review copy. No outcome promise is added. "+BOARD("Main §3.7")+" Yellow = CTA only; bar is Ink."}),
  s("02","Trust",trustScreen(),{chips:["REVIEW COPY"],note:"Observable facts before interpretation. No motive or diagnosis. "+D2}),
  s("03","Child setup",childSetupScreen(),{note:"No grammatical-gender field is invented. "+D2}),
  s("04","Morning moment",momentScreen(),{note:"Morning is active. leaving_home selected. "+D2,flag:"<b>Presentation:</b> “תיק ודברים — בהמשך” rendered with the existing disabled-text token (the label marks it unavailable). No new component; Product to confirm it is non-selectable."}),
  s("05","Situation",situationScreen(),{chips:["REVIEW COPY","DEPENDENCY"],note:"The current source artifact intentionally does not invent an option inventory for this screen. "+D2,flag:"<b>On screen:</b> the copy asks the parent to choose, but no options exist. The screen reads as broken in Parent View. Kept as source; not filled."}),
  s("06","Open Description",descriptionScreen(),{chips:["REVIEW COPY"],note:"Specific observable morning episode. No motive question. "+D2+" CTA sits directly under the textarea (§2.4 keyboard rule)."}),
  s("07","Initial Picture",initialPictureScreen(),{chips:["REVIEW COPY"],note:"Shows established facts and direction without Engine / professional enums. "+BOARD("K02 §3.1")+" Last dot Ink 15px."}),
  s("08","First Plan",firstPlanScreen(),{chips:["REVIEW COPY"],note:"One Target, one PlanningInstance, one parent action. "+BOARD("K03 §3.5")+" Hero = beige; yellow = CTA only. Support block HOLD.",flag:"<b>On screen:</b> the Target sentence appears twice (hero + “מה מסתכלים לראות”). Source copy — flagged, not removed."}),
  s("09","Child Preparation",childPreparationScreen(),{chips:["REVIEW COPY"],note:"Presentation of preparation is not Progress evidence. "+BOARD("K04 §3.2")}),
  s("10","Pre-Day · cycle 1",preDayScreen(1),{chips:["REVIEW COPY"],note:"Same PlanningInstance as First Plan. "+BOARD("K05 §3.6")+" Child-prep block shown only before the first attempt."}),
  s("11","Runtime · cycle 1",runtimeScreen(),{chips:["REVIEW COPY"],note:"One current action. No professional theory. "+BOARD("K06 §3.3")+" Only yellow = “עכשיו”. No primary. “עדיין אין התחלה” in disabled colour until the wait ends (existing Product behaviour)."}),
  s("12","Check-in · cycle 1",validCheckinScreen(),{chips:["REVIEW COPY"],note:"Valid at-target review scenario. Closed REV3 structure preserved. "+BOARD("K07 §3.4")+" + CHECKIN_PRACTICE_CONTEXT v0.2. Selected = ink dot only.",flag:"<b>Wording:</b> “מה ראית אצל הילד?” is masculine generic beside a named girl (נועה). <b>Gap:</b> G3 has no dashed [UNKNOWN] row, which v0.2 §3 requires. Neither changed here."}),
  s("13","KEEP · cycle 1",keepScreen(),{chips:["REVIEW COPY"],note:"No attempt count, score, percentage or streak shown. "+D2}),
  s("14","Home between days",homeBetweenDaysScreen(),{chips:["REVIEW COPY"],note:"Governed Home H2 continuity for an active plan. "+D2})
);
for(let c=2;c<=3;c++){
  branches.primary.screens.push(
    s(`p${c}a`,`Pre-Day · cycle ${c}`,preDayScreen(c),{chips:["REVIEW COPY"],note:"Repeated practice uses the same governed plan."}),
    s(`p${c}b`,`Runtime · cycle ${c}`,runtimeScreen(),{chips:["REVIEW COPY"],note:"Same target and plan."}),
    s(`p${c}c`,`Check-in · cycle ${c}`,validCheckinScreen(),{chips:["REVIEW COPY"],note:"Another valid at-target morning."}),
    s(`p${c}d`,`KEEP · cycle ${c}`,keepScreen(),{chips:["REVIEW COPY"],note:"Still no parent-facing numeric Progress counter."}),
    s(`p${c}e`,`Home between days · cycle ${c}`,homeBetweenDaysScreen(),{chips:["REVIEW COPY"],note:"Between-days continuity."})
  );
}
branches.primary.screens.push(
  s("p4a","Pre-Day · cycle 4",preDayScreen(4),{chips:["REVIEW COPY"],note:"Fourth valid morning is rendered so FADE is not visually implied after only two attempts."}),
  s("p4b","Runtime · cycle 4",runtimeScreen(),{chips:["REVIEW COPY"]}),
  s("p4c","Check-in · cycle 4",validCheckinScreen(),{chips:["REVIEW COPY"]}),
  s("p4d","FADE",fadeScreen(),{chips:["REVIEW COPY"],note:"FADE closes the current Target. The CTA initiates the governed target re-check. No automatic 2→1 and no next Target is invented. "+D2}),
  s("p4e","Lawful exit · no eligible next Target",lawfulFadeExit(),{chips:["REVIEW COPY","PRODUCT BLOCKER"],
    note:"BRANCH (PD-01A): target re-check finds no eligible next Target. The parent gets a lawful non-practice exit. "+D2,
    blocker:true,boundary:true,boundaryText:"CTA “למסך הבית” → Home after PD-01A. Destination state is not governed. Journey stops here; no Home screen is drawn."})
);
branches.noPractice.screens.push(
  s("np1","Check-in · no practice",noPracticeCheckin(),{note:"No reason question is added. G1 = NO: footer and CTA follow G1 directly."}),
  s("np2","No-practice result",noPracticeResult(),{note:"No Observation, no measured attempt, no ProgressSnapshot. Same plan continues. "+D2})
);
branches.nonEvidence.screens.push(
  s("ne1","Check-in · practice not as planned",nonEvidenceCheckin(),{chips:["REVIEW COPY"],note:"G3–G5 remain collected. G2 does not itself decide evidence usability. G2a (SOURCE-PENDING) inline under G2, multi-select squares; last row dashed [UNKNOWN]."}),
  s("ne2","Non-evidence Learning Result",nonEvidenceResult(),{note:"Locked non-evidence meaning. No KEEP/ADJUST/FADE card, score, streak or context echo. Beige essence block + same-plan CTA (v0.2 §6).",flag:"<b>Wording:</b> the CTA label is a full sentence with a full stop (“בתרגול הבא ממשיכים עם אותה תכנית.”). It wraps to two lines at 320 and reads as a statement, not an action. Kept as source. <b>Also:</b> the context-strip progress dots are visible here; v0.2 §6 bars any Progress dot on this screen — needs a ruling on whether chrome dots count."})
);
branches.adjust.screens.push(
  s("ad1","ADJUST result",adjustResult(),{chips:["REVIEW COPY"],note:"ADJUST returns to Planning with a reason. It is not automatic +1. "+D2}),
  s("ad2","Lawful exit · no approved alternative",adjustLawfulExit(),{chips:["REVIEW COPY","PRODUCT BLOCKER"],
    note:"PD-02 lawful non-practice exit. No intervention, START action or automatic +1 is invented. "+D2,
    blocker:true,boundary:true,boundaryText:"CTA “למסך הבית” → Home after PD-02. Destination state is not governed. Journey stops here; no Home screen is drawn."})
);
branches.reopen.screens.push(
  s("ro1","Ordinary reopen · active plan",reopenPlan(),{chips:["REVIEW COPY"],note:"Ordinary successful resume returns to the governed active plan. "+D2}),
  s("ro2","Ordinary reopen · open attempt",reopenAttempt(),{chips:["REVIEW COPY"],note:"Open attempt is restored rather than silently replaced by a fresh morning. Two secondaries, no primary → no yellow on this screen. "+D2}),
  s("ro3","Ordinary reopen · pending Check-in",reopenCheckin(),{chips:["REVIEW COPY"],note:"Pending report remains pending. "+D2,flag:"<b>On screen:</b> the beige block repeats the context-strip text word for word (“נועה · בוקר · יציאה מהבית”). Source copy — flagged, not removed."})
);
branches.recovery.screens.push(
  s("rc1","PD-03R recovery",recovery(),{chips:["REVIEW COPY","PRODUCT BLOCKER"],
    note:"No practice action is exposed. No claim is made about whether previous mornings were preserved, lost, counted or not counted. "+D2,
    blocker:true,boundary:true,boundaryText:"CTA “למסך הבית” → Home after PD-03R. Destination state is not governed. Journey stops here; no Home screen is drawn."})
);
branches.uncovered.screens.push(
  s("uc1","FADE / target re-check boundary",fadeScreen(),{chips:["BRANCH","DEPENDENCY"],
    note:"BRANCH: target re-check may establish an eligible Target, but Planning has no approved template. PD-01B preserves the existing target_creation coverage-gap semantics. "+D2,
    blocker:true,boundary:true,boundaryText:"After “בדיקת הצעד הבא”: eligible Target, no covered template. The source artifact does not supply parent-facing presentation beyond this point. No UI is invented."})
);

/* ===== Review shell ===== */
const $ = id => document.getElementById(id);
const app = $("app"), mount = $("mount"), phone = $("phone"), panel = $("panel"), boundary = $("boundary"), board = $("board");
let cur = "primary", idx = 0, review = false, storyboard = false;

Object.entries(branches).forEach(([k,b])=>{const o=document.createElement("option");o.value=k;o.textContent=b.label;$("branch").appendChild(o)});

const chipCls = c => c.includes("BLOCKER")?"chip blocker":c.includes("DEPENDENCY")?"chip dependency":"chip";
function panelHtml(scr){
  const chips=[...scr.chips]; if(scr.flag) chips.push("PRESENTATION FLAG");
  return `<div class="rv-chips">${chips.map(c=>`<span class="${c==='PRESENTATION FLAG'?'chip flag':chipCls(c)}">${c}</span>`).join("")}</div>
    <div class="rv-note">${scr.note||"No additional review note."}</div>${scr.flag?`<div class="rv-flag">${scr.flag}</div>`:""}`;
}
const boundaryHtml = scr => `<b>PRODUCT BLOCKER — ${scr.id==="uc1"?"GOVERNED PRESENTATION BOUNDARY":HOME_GAP}</b>${scr.boundaryText}`;

function renderSingle(){
  const arr=branches[cur].screens; idx=Math.max(0,Math.min(idx,arr.length-1));
  const scr=arr[idx];
  mount.innerHTML=scr.html; phone.scrollTop=0;
  panel.innerHTML=panelHtml(scr);
  boundary.innerHTML=scr.boundary?boundaryHtml(scr):"";
  $("single").classList.toggle("at-boundary",scr.boundary);
  $("counter").textContent=`${scr.title} · ${idx+1} / ${arr.length}`;
  $("prev").disabled=idx===0;
  $("next").disabled=idx===arr.length-1||scr.boundary;
}
function card(scr,n){
  return `<section class="board-card${scr.boundary?' at-boundary':''}">
    <div class="board-title">${n}. ${scr.title}</div>
    <div class="phone">${scr.html}</div>
    ${scr.boundary?`<div class="rv-boundary">${boundaryHtml(scr)}</div>`:""}
    <aside class="rv-panel">${panelHtml(scr)}</aside>
  </section>`;
}
function renderBoard(keys, dedupe){
  board.innerHTML = (dedupe?`<div class="capture-head"><b>MORNING_FULL_PARENT_JOURNEY_HE_VISUAL_REVIEW_v0_2</b> · ${document.body.classList.contains("device-320")?"320":"390"} · ${review?"Review View":"Parent View"} · every distinct screen of the primary journey and all secondary branches. Repeated cycles 2–4 that are identical to cycle 1 are shown once; the HTML holds the full sequence.</div>`:"") +
  keys.map(k=>{
    const seen=new Set(); let n=0;
    const items=branches[k].screens.map(scr=>{n++; if(dedupe){ if(seen.has(scr.html)) return ""; seen.add(scr.html);} return card(scr,n);}).join("");
    return `<div class="board-group"><h2>${branches[k].label}</h2><div class="board-grid">${items}</div></div>`;
  }).join("");
}
function sync(){
  app.classList.toggle("review-mode",review);
  document.body.classList.toggle("storyboard-mode",storyboard);
  $("bParent").setAttribute("aria-pressed",!review); $("bReview").setAttribute("aria-pressed",review);
  $("bSingle").setAttribute("aria-pressed",!storyboard); $("bBoard").setAttribute("aria-pressed",storyboard);
  storyboard?renderBoard([cur],false):renderSingle();
}
function setWidth(w){
  document.body.classList.toggle("device-320",w===320); document.body.classList.toggle("device-390",w!==320);
  $("b390").setAttribute("aria-pressed",w!==320); $("b320").setAttribute("aria-pressed",w===320);
}
$("bParent").onclick=()=>{review=false;sync()};
$("bReview").onclick=()=>{review=true;sync()};
$("b390").onclick=()=>setWidth(390);
$("b320").onclick=()=>setWidth(320);
$("bSingle").onclick=()=>{storyboard=false;sync()};
$("bBoard").onclick=()=>{storyboard=true;sync()};
$("prev").onclick=()=>{idx--;renderSingle()};
$("next").onclick=()=>{if(!branches[cur].screens[idx].boundary){idx++;renderSingle()}};
$("branch").onchange=e=>{cur=e.target.value;idx=0;sync()};
document.addEventListener("keydown",e=>{
  if(storyboard||e.target.closest("textarea,input,select"))return;
  if(e.key==="ArrowLeft"&&!$("next").disabled){idx++;renderSingle()}
  if(e.key==="ArrowRight"&&!$("prev").disabled){idx--;renderSingle()}
});
/* In-screen selection only (no routing): radio = one per group, check = toggle */
document.addEventListener("click",e=>{
  const r=e.target.closest(".row"); if(!r||r.getAttribute("aria-disabled")==="true")return;
  const g=r.closest("[data-mode]"); if(!g)return;
  if(r.getAttribute("role")==="checkbox"){const on=!r.classList.contains("selected");r.classList.toggle("selected",on);r.setAttribute("aria-checked",on);return}
  g.querySelectorAll('.row[role="radio"]').forEach(x=>{x.classList.remove("selected");x.setAttribute("aria-checked","false")});
  r.classList.add("selected");r.setAttribute("aria-checked","true");
});

/* URL controls: ?mode=review ?width=320 ?branch=adjust ?view=storyboard ?capture=1 */
const q=new URLSearchParams(location.search);
if(q.get("mode")==="review") review=true;
if(q.get("width")==="320") setWidth(320);
if(branches[q.get("branch")]){cur=q.get("branch");$("branch").value=cur}
if(q.get("view")==="storyboard") storyboard=true;
if(q.get("capture")==="1"){
  document.body.classList.add("capture","storyboard-mode");
  app.classList.toggle("review-mode",review);
  renderBoard(Object.keys(branches),true);
}else sync();
</script>
</body>
</html>
